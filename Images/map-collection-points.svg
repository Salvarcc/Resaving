<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <style>
      .land { fill: #EFF3EF; }
      .ocean { fill: #CBE6EE; }
      .coast-cliff { stroke: #BDCFC6; stroke-width: 4; fill: none; }
      .park { fill: #D6ECD9; stroke: #BCD8C0; stroke-width: 1.5; }
      .highway { stroke: #FFE0A3; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .highway-border { stroke: #D8BD80; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .avenue { stroke: #FFFFFF; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .avenue-border { stroke: #CFDDD5; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .street { stroke: #FFFFFF; stroke-width: 4; stroke-linecap: round; fill: none; }
      .street-border { stroke: #DDE6E0; stroke-width: 5; fill: none; }
      .district-border { stroke: #95AFA2; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
      .district-label { font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 800; fill: #658373; letter-spacing: 2.5px; }
      .road-label { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #526E60; }
      .poi-label { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #1E4633; }
      .water-label { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 800; fill: #7AAABA; letter-spacing: 3px; font-style: italic; }
      .compass-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; font-weight: 900; fill: #0B4A30; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#073522" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1200" height="800" class="land" />

  <path d="M 0 520 Q 240 560 480 620 T 900 740 Q 1040 780 1200 800 L 1200 800 L 0 800 Z" class="ocean" />
  <path d="M 0 520 Q 240 560 480 620 T 900 740 Q 1040 780 1200 800" class="coast-cliff" />
  <path d="M 0 528 Q 240 568 480 628 T 900 748 Q 1040 788 1200 808" stroke="#E5F3F7" stroke-width="6" fill="none" />

  <rect x="280" y="160" width="220" height="170" rx="18" class="park" />
  <text x="320" y="245" class="poi-label">Parque de las Leyendas</text>
  <text x="335" y="262" font-family="'Inter', sans-serif" font-size="9.5px" fill="#437559">Zona Botánica y Zoológica</text>

  <rect x="580" y="280" width="130" height="90" rx="12" class="park" />
  <text x="600" y="325" class="poi-label">Parque Juan Pablo II</text>

  <rect x="180" y="440" width="110" height="60" rx="10" class="park" />
  <text x="195" y="475" class="poi-label">Parque Media Luna</text>

  <rect x="850" y="120" width="180" height="130" rx="16" class="park" />
  <text x="890" y="185" class="poi-label">Campus PUCP</text>
  <text x="895" y="202" font-family="'Inter', sans-serif" font-size="9.5px" fill="#437559">Áreas Verdes y Huerto</text>

  <rect x="740" y="490" width="160" height="50" rx="8" class="park" />
  <text x="765" y="520" class="poi-label">Malecón Grau / Castagnola</text>

  <g opacity="0.85">
    <path d="M 120 40 L 120 480 M 200 40 L 200 420 M 280 40 L 280 160 M 520 40 L 520 280 M 600 40 L 600 260 M 740 40 L 740 480 M 820 40 L 820 480 M 960 40 L 960 560 M 1060 40 L 1060 620" class="street-border" />
    <path d="M 120 40 L 120 480 M 200 40 L 200 420 M 280 40 L 280 160 M 520 40 L 520 280 M 600 40 L 600 260 M 740 40 L 740 480 M 820 40 L 820 480 M 960 40 L 960 560 M 1060 40 L 1060 620" class="street" />

    <path d="M 40 100 L 1160 100 M 40 180 L 260 180 M 520 180 L 830 180 M 40 260 L 260 260 M 520 260 L 830 260 M 40 340 L 560 340 M 730 340 L 1160 340 M 40 420 L 720 420 M 40 480 L 720 480 M 300 540 L 720 540 M 500 600 L 820 600" class="street-border" />
    <path d="M 40 100 L 1160 100 M 40 180 L 260 180 M 520 180 L 830 180 M 40 260 L 260 260 M 520 260 L 830 260 M 40 340 L 560 340 M 730 340 L 1160 340 M 40 420 L 720 420 M 40 480 L 720 480 M 300 540 L 720 540 M 500 600 L 820 600" class="street" />
  </g>

  <g>
    <path d="M 0 380 Q 300 375 600 370 T 1200 350" class="highway-border" />
    <path d="M 0 380 Q 300 375 600 370 T 1200 350" class="highway" />

    <path d="M 380 0 L 380 800" class="avenue-border" />
    <path d="M 380 0 L 380 800" class="avenue" />

    <path d="M 680 0 L 680 800" class="avenue-border" />
    <path d="M 680 0 L 680 800" class="avenue" />

    <path d="M 0 200 L 1200 200" class="avenue-border" />
    <path d="M 0 200 L 1200 200" class="avenue" />

    <path d="M 0 500 Q 240 540 480 600 T 900 720 Q 1040 760 1200 780" class="avenue-border" />
    <path d="M 0 500 Q 240 540 480 600 T 900 720 Q 1040 760 1200 780" class="avenue" />

    <path d="M 0 535 Q 240 575 480 635 T 900 755 Q 1040 795 1200 815" stroke="#FFE0A3" stroke-width="6" fill="none" />
  </g>

  <text x="80" y="368" class="road-label">AV. LA MARINA</text>
  <text x="470" y="362" class="road-label">AV. LA MARINA (CRUCE C/ UNIVERSITARIA)</text>
  <text x="880" y="342" class="road-label">AV. LA MARINA (HACIA PUEBLO LIBRE)</text>

  <text x="390" y="80" class="road-label" transform="rotate(90, 390, 80)">AV. ELMER FAUCETT</text>
  <text x="690" y="80" class="road-label" transform="rotate(90, 690, 80)">AV. UNIVERSITARIA</text>
  <text x="690" y="440" class="road-label" transform="rotate(90, 690, 440)">AV. UNIVERSITARIA (SUR)</text>

  <text x="140" y="192" class="road-label">AV. VENEZUELA</text>
  <text x="100" y="492" class="road-label">AV. LA PAZ / COSTANERA</text>
  <text x="460" y="650" class="road-label" transform="rotate(18, 460, 650)">CIRCUITO DE PLAYAS · COSTA VERDE</text>

  <path d="M 520 0 L 520 800" class="district-border" />
  <path d="M 880 0 L 880 800" class="district-border" />
  <path d="M 0 300 L 1200 300" class="district-border" stroke-opacity="0.5" />

  <text x="220" y="70" class="district-label">BELLAVISTA</text>
  <text x="560" y="70" class="district-label">SAN MIGUEL</text>
  <text x="940" y="70" class="district-label">PUEBLO LIBRE</text>
  <text x="920" y="440" class="district-label">MAGDALENA DEL MAR</text>

  <text x="180" y="700" class="water-label">OCÉANO PACÍFICO</text>
  <text x="210" y="725" font-family="'Inter', sans-serif" font-size="11px" font-weight="700" fill="#8BB8C7" letter-spacing="1.5px">LITORAL COSTA VERDE</text>

  <g transform="translate(1080, 70)" filter="url(#shadow)">
    <circle cx="26" cy="26" r="24" fill="#FFFFFF" stroke="#0B4A30" stroke-width="2" />
    <path d="M 26 8 L 33 24 L 26 21 L 19 24 Z" fill="#0B4A30" />
    <path d="M 26 44 L 33 28 L 26 31 L 19 28 Z" fill="#95AFA2" />
    <text x="22" y="5" class="compass-text">N</text>
  </g>

  <g transform="translate(60, 740)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#DBE7DF" />
    <line x1="15" y1="13" x2="145" y2="13" stroke="#14251B" stroke-width="2" />
    <line x1="15" y1="8" x2="15" y2="18" stroke="#14251B" stroke-width="2" />
    <line x1="80" y1="10" x2="80" y2="16" stroke="#14251B" stroke-width="1.5" />
    <line x1="145" y1="8" x2="145" y2="18" stroke="#14251B" stroke-width="2" />
    <text x="12" y="23" font-family="'Inter', sans-serif" font-size="9px" font-weight="700" fill="#14251B">0</text>
    <text x="73" y="23" font-family="'Inter', sans-serif" font-size="9px" font-weight="700" fill="#14251B">500 m</text>
    <text x="135" y="23" font-family="'Inter', sans-serif" font-size="9px" font-weight="700" fill="#14251B">1 km</text>
  </g>
</svg>